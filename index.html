<!DOCTYPE html>
<html>

<head>
  <title>Yang Gang Live tweets</title>
  <script src="http://code.jquery.com/jquery-1.9.1.min.js"></script>

  <style>
    .tooltip {
      position: relative;
      display: inline-block;
      border-bottom: 1px dotted black;
    }
    
    .tooltip .tooltiptext {
      visibility: hidden;
      width: 120px;
      background-color: black;
      color: #fff;
      text-align: center;
      border-radius: 6px;
      padding: 5px 0;
    
      /* Position the tooltip */
      position: absolute;
      z-index: 1;
    }
    
    .tooltip:hover .tooltiptext {
      visibility: visible;
    }
    </style>
</head>

<body>
  <!-- Enter text to send to the websocket server:
<div id="send">
    <input type="text" id="data" size="100"/><br>
    <input type="button" id="sendtext" value="send text"/>
</div> -->

  <div style="width: 100%; overflow: hidden;">
    <div id="output" style="width: 70%; height:500px; float: left;overflow: scroll;">
      <h2>Live Yang Gang tweets stream</h2>
    </div>
    <div id="lb" style="margin-left: 75%; height:500px;overflow: scroll;">
      <h2 style="margin:0 0 0 0 ">Daily Leaderboard</h2>
      <div class="tooltip" style="font-size:12px">(What's this?)
        <span class="tooltiptext">This shows number of YangGang tweets made by each Yangster. List Resets everyday at 00:00 GMT</span>
      </div>
      <table>
        <thead>
          <td><b>Rank</b></td>
          <td>
            <h3>Yangsta Handle</h3>
          </td>
          <td><b>Tweets</b></td>
        </thead>
        <tbody id="lb_tbody">

        </tbody>
      </table>
    </div>
  </div>
  <h3>Yesterday's leaderboard winner : </h3>
  <div style="width:800px;">
    <div style="width:100px; float:left;">
      <img style="height: 100px;" src="https://www.yang2020.com/wp-content/uploads/YangCheer_Animation_MATH_153x238.gif">

    </div>
    <div style="width:300px; float:left;">
    <h1 id='winner_name'>@GangUbi </h1>
  </div>
  </div>

</body>

</html>
<script>

  jQuery(function ($) {

    if (!("WebSocket" in window)) {
      alert("Your browser does not support web sockets");
    } else {
      setup();
    }


    function setup() {

      // Note: You have to change the host var 
      // if your client runs on a different machine than the websocket server

      // var host = "ws://localhost:80/ws";
      var host = "ws://" + window.location.host + "/ws";
      var socket = new WebSocket(host);
      //console.log("socket status: " + socket.readyState);   

      //  var $txt = $("#data");
      //  var $btnSend = $("#sendtext");

      //  $txt.focus();

      //  // event handlers for UI
      //  $btnSend.on('click',function(){
      //    var text = $txt.val();
      //    if(text == ""){
      //      return;
      //    }
      //    socket.send(text);
      //    $txt.val("");    
      //  });

      //  $txt.keypress(function(evt){
      //    if(evt.which == 13){
      //      $btnSend.click();
      //    }
      //  });

      // event handlers for websocket
      if (socket) {

        socket.onopen = function () {
          //alert("connection opened....");
        }

        socket.onmessage = function (msg) {
          json = JSON.parse(msg.data)
          if (json['lb']) {
            updateLeaderBoard(json['lb'])
          }
          else if (json['winner'] !== undefined) {
            updateWinnerName(json['winner'])
          }
          else { showTweet(json); }
        }

        socket.onclose = function () {
          //alert("connection closed....");
          showTweet("The connection has been closed.");
        }

      } else {
        console.log("invalid socket");
      }

      function showTweet(tweet) {
        var p = document.createElement('p');
        p.innerHTML = '<b>' + tweet.username + '</b>' + ' : ' + tweet.text;
        document.getElementById('output').appendChild(p);
      }



    }

  });
  function updateWinnerName(msg){
    if(msg){
    document.getElementById('winner_name').innerHTML = '@'+msg
    }
  }
  function updateLeaderBoard(msg) {
    var names = [];
    var tweets = [];
    let bubbleSort = (inputArr) => {
      let len = inputArr.length;
      let swapped;
      do {
        swapped = false;
        for (let i = 0; i < len; i++) {
          if (inputArr[i] < inputArr[i + 1]) {
            let tmp = inputArr[i];
            let tmp1 = names[i];
            inputArr[i] = inputArr[i + 1];
            names[i] = names[i + 1];
            inputArr[i + 1] = tmp;
            names[i + 1] = tmp1;
            swapped = true;
          }
        }
      } while (swapped);
      return inputArr;
    };
    function sortByValue(jsObj) {

      for (var i in jsObj) {
        // Push each JSON Object entry in array by [value, key]
        names.push(i);

        tweets.push(parseInt(jsObj[i]));

      }
      console.log(names)
      console.log(tweets)
      bubbleSort(tweets)

      return names;
    }
    const sorted = sortByValue(msg)
    document.getElementById('lb_tbody').innerHTML = ""
    count = 0
    for (var item in sorted) {
      //  alert(item)
      const tr = document.createElement('tr')
      tr.innerHTML = '<td>'+ ++count +'</td><td>@' + sorted[item] + '</td><td>' + msg[sorted[item]] + '</td>'
      document.getElementById('lb_tbody').append(tr)
    }
  }
</script>
